[package]
name = "dollar-dashboard"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local Market Monitor for dollar liquidity, Bitcoin, AI infrastructure, and nuclear energy"
publish = false

[[bin]]
name = "dollar-dashboard"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "charset", "gzip", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
